name: ci
on: [push]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python engines.py
      - run: python -c "import json; p=json.load(open('content_pack.json',encoding='utf-8')); assert all(i.get('ncertRef') and i.get('cbseFln') for i in p['items'])"
      - run: python -c "import py_compile; py_compile.compile('app.py',doraise=True)"
